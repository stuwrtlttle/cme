name: Rebuild Static Site

# Manually trigger static site rebuild when entries are modified directly
# (bypassing the proposal workflow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/entries/CME-*.json'
      - 'data/categories.json'
      - 'templates/**'
      - 'build_site.py'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Rebuild static site
        run: |
          echo "Rebuilding static site..."
          uv run python build_site.py

          # Count total entries
          TOTAL=$(ls data/entries/CME-*.json | wc -l)
          echo "Built static site with $TOTAL entries"
          echo "total_entries=$TOTAL" >> "$GITHUB_ENV"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to static site"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Static site has changes"
          fi

      - name: Commit rebuilt site
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/
          git commit -m "Rebuild static site (${{ env.total_entries }} entries) [skip changelog]"
          git push
